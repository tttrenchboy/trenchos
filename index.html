<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrenchOS v1.0.4 | quat</title>
    <style>
        :root {
            --bg-color: #050505;
            --main-accent: #ffffff;
            --dim-accent: rgba(255, 255, 255, 0.25);
            --text-gray: #888;
            --border-color: #222222;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--font-stack);
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.02),
                rgba(255, 255, 255, 0.01),
                rgba(255, 255, 255, 0.02)
            );
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .splash-btn {
            background: transparent;
            border: 1px solid var(--main-accent);
            color: var(--main-accent);
            padding: 15px 30px;
            font-family: var(--font-stack);
            font-size: 1.1rem;
            text-transform: lowercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px var(--dim-accent);
            transition: all 0.2s ease;
        }

        .splash-btn:hover {
            background: var(--main-accent);
            color: #000;
            box-shadow: 0 0 20px var(--main-accent);
        }

        /* Bootup Screen */
        #boot {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            padding: 40px;
            display: none;
            flex-direction: column;
            font-size: 0.9rem;
            color: #ffffff;
            z-index: 40;
            overflow: hidden;
        }

        #boot-ascii {
            white-space: pre;
            font-family: var(--font-stack);
            color: #ffffff;
            font-size: 0.75rem;
            line-height: 1.1;
            margin-bottom: 25px;
        }

        .boot-log-line {
            margin-bottom: 12px;
            color: #ffffff;
            font-family: var(--font-stack);
            white-space: pre;
        }

        /* Login Screen */
        #login-ui {
            display: none;
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            justify-content: center;
            align-items: center;
            z-index: 30;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #login-ui.fade-in {
            opacity: 1;
        }

        .login-window {
            width: 250px;
            background: #111111;
            border: 1px solid #2a2a2a;
            box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 2px rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }

        .login-header {
            background: #181818;
            padding: 5px 10px;
            border-bottom: 1px solid #2a2a2a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.7rem;
            color: #777;
            letter-spacing: 1px;
        }

        .login-close {
            color: #555;
            font-size: 0.75rem;
        }

        .login-body {
            padding: 20px 16px 16px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .login-title {
            font-size: 1rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .login-subtitle {
            font-size: 0.7rem;
            color: #777;
            margin-bottom: 14px;
            letter-spacing: 1px;
        }

        .login-select-wrapper {
            width: 100%;
            margin-bottom: 16px;
            position: relative;
        }

        .login-select {
            width: 100%;
            background: #080808;
            border: 1px solid #333;
            color: #eee;
            padding: 6px 10px;
            font-family: var(--font-stack);
            font-size: 0.8rem;
            outline: none;
            appearance: none;
            -webkit-appearance: none;
        }

        .login-select-wrapper::after {
            content: '∨';
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 0.65rem;
            pointer-events: none;
        }

        .login-btn {
            background: #1c1c1c;
            border: 1px solid #3d3d3d;
            color: #eee;
            padding: 5px 24px;
            font-family: var(--font-stack);
            font-size: 0.75rem;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .login-btn:hover {
            background: #2a2a2a;
            border-color: #666;
            color: #fff;
        }

        /* Main OS Interface */
        #main-ui {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.6s ease;
        }

        #main-ui.fade-in {
            opacity: 1;
        }

        .terminal-window {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 1px var(--text-gray);
            border-radius: 4px;
            backdrop-filter: blur(5px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: #0f0f0f;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #222;
        }

        .dot.active { background: #555; }

        .terminal-body {
            padding: 24px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Avatar Section with White Frame */
        .avatar-container {
            width: 110px;
            height: 110px;
            border: 1px solid #ffffff;
            padding: 3px;
            margin-bottom: 14px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
        }

        .user-name {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .user-desc {
            color: var(--text-gray);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .sub-tag {
            color: var(--main-accent);
            font-size: 0.8rem;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-color);
            margin: 16px 0 12px 0;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--main-accent);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 5px var(--main-accent);
        }

        /* Interactive Shell Console */
        .cli-container {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            font-size: 0.8rem;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .cli-output {
            color: #aaa;
            margin-bottom: 6px;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .cli-input-row {
            display: flex;
            align-items: center;
            color: var(--main-accent);
        }

        .cli-prompt {
            margin-right: 8px;
        }

        .cli-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--main-accent);
            font-family: var(--font-stack);
            font-size: 0.8rem;
            width: 100%;
        }

        .cmd-link {
            color: var(--main-accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <!-- Splash Screen -->
    <div id="splash">
        <button class="splash-btn" onclick="startBootSequence()">click to enter...</button>
    </div>

    <!-- Boot Terminal -->
    <div id="boot">
        <div id="boot-ascii"></div>
        <div id="boot-log"></div>
    </div>

    <!-- Login Screen -->
    <div id="login-ui">
        <div class="login-window">
            <div class="login-header">
                <span>user login</span>
                <span class="login-close">✕</span>
            </div>
            <div class="login-body">
                <div class="login-title">Login</div>
                <div class="login-subtitle">Select a user to login to</div>
                <div class="login-select-wrapper">
                    <select class="login-select" id="user-select">
                        <option value="quat">quat</option>
                    </select>
                </div>
                <button class="login-btn" onclick="submitLogin()">OK</button>
            </div>
        </div>
    </div>

    <!-- Main OS Interface -->
    <div id="main-ui">
        <div class="terminal-window">
            <div class="terminal-header">
                <span>TrenchOS v1.0.4 - bash</span>
                <div class="terminal-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="terminal-body">
                <!-- Avatar, Display, Description ONLY -->
                <div class="avatar-container">
                    <img src="image_9ffce4.jpg" alt="quat avatar">
                </div>

                <div class="user-name" id="display-username">quat</div>
                <div class="user-desc">1017</div>
                <div class="sub-tag"><span class="status-dot"></span>system/online</div>

                <div class="divider"></div>

                <!-- Interactive Terminal Box -->
                <div class="cli-container" id="cli-box" onclick="document.getElementById('cli-input').focus()">
                    <div class="cli-output" id="cli-output">Type 'help' to list terminal commands.</div>
                    <div class="cli-input-row">
                        <span class="cli-prompt" id="cli-prompt-label">quat@trench:~$</span>
                        <input type="text" id="cli-input" class="cli-input" autocomplete="off" spellcheck="false">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Embedded Audio Element -->
    <audio id="bg-audio" loop>
        <source src="Skeletrix Melodies (1).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');

        const asciiBanner = ` _____                    _       ____   ____ 
|_   _| __ ___ _ __   ___| |__   / __ \\ / ___|
  | || '__/ _ \\ '_ \\ / __| '_ \\ | |  | |\\___ \\
  | || | |  __/ | | | (__| | | || |__| | ___) |
  |_||_|  \\___|_| |_|\\___|_| |_| \\____/ |____/ `;

        const bootLogs = [
            "[ OK ] quat is online.",
            "[ OK ] Loading terminal...",
            "[ OK ] System ready.",
            "[ OK ] Welcome, quat."
        ];

        function startBootSequence() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('boot').style.display = 'flex';
                
                audio.volume = 0.5;
                audio.play().catch(() => console.log("Audio playback blocked"));

                typeAsciiBanner(0);
            }, 500);
        }

        // Print ASCII Banner Character-by-Character
        function typeAsciiBanner(charIndex) {
            const asciiBox = document.getElementById('boot-ascii');
            if (charIndex < asciiBanner.length) {
                asciiBox.textContent += asciiBanner.charAt(charIndex);
                setTimeout(() => typeAsciiBanner(charIndex + 1), 3);
            } else {
                setTimeout(() => runBootLogs(0), 100);
            }
        }

        // CRT Character-by-Character Boot Log Sequence
        function runBootLogs(index) {
            if (index < bootLogs.length) {
                const logItem = document.createElement('div');
                logItem.className = 'boot-log-line';
                document.getElementById('boot-log').appendChild(logItem);
                
                const textToType = bootLogs[index];
                let charIndex = 0;

                function typeBootChar() {
                    if (charIndex < textToType.length) {
                        logItem.textContent += textToType.charAt(charIndex);
                        charIndex++;
                        setTimeout(typeBootChar, 18);
                    } else {
                        setTimeout(() => runBootLogs(index + 1), 180);
                    }
                }
                typeBootChar();
            } else {
                setTimeout(() => {
                    document.getElementById('boot').style.display = 'none';
                    const loginUi = document.getElementById('login-ui');
                    loginUi.style.display = 'flex';
                    setTimeout(() => loginUi.classList.add('fade-in'), 20);
                }, 500);
            }
        }

        function submitLogin() {
            const loginUi = document.getElementById('login-ui');
            loginUi.classList.remove('fade-in');

            setTimeout(() => {
                loginUi.style.display = 'none';
                const mainUi = document.getElementById('main-ui');
                mainUi.style.display = 'flex';
                setTimeout(() => {
                    mainUi.classList.add('fade-in');
                    document.getElementById('cli-input').focus();
                }, 20);
            }, 600);
        }

        // CRT Character-by-Character Terminal Printer
        let isTyping = false;
        function typeWriterPrint(promptText, responseText) {
            const cliOutput = document.getElementById('cli-output');
            const cliBox = document.getElementById('cli-box');
            
            const promptLine = document.createElement('div');
            promptLine.innerHTML = `<span style="color: var(--main-accent)">quat@trench:~$ ${promptText}</span>`;
            cliOutput.appendChild(promptLine);

            if (!responseText) return;

            const responseLine = document.createElement('div');
            cliOutput.appendChild(responseLine);

            isTyping = true;

            const plainText = responseText.replace(/<[^>]*>/g, '');
            let i = 0;
            const speed = 12;

            function typeChar() {
                if (i < plainText.length) {
                    responseLine.textContent += plainText.charAt(i);
                    i++;
                    cliBox.scrollTop = cliBox.scrollHeight;
                    setTimeout(typeChar, speed);
                } else {
                    responseLine.innerHTML = responseText;
                    isTyping = false;
                    cliBox.scrollTop = cliBox.scrollHeight;
                }
            }
            typeChar();
        }

        // Terminal Interactive Commands
        const cliInput = document.getElementById('cli-input');
        const cliBox = document.getElementById('cli-box');

        const commands = {
            'help': `COMMANDS:
---------
help     : list available system commands
whoami   : display profile details
socials  : social media links
audio    : audio options
neofetch : display system specs
clear    : clear output screen`,

            'whoami': () => `user : ${document.getElementById('display-username').innerText}\ndesc : 1017\nhost : github.io`,

            'socials': `discord   : @diorpillow\ninstagram : <a href="https://instagram.com/diorpillow" target="_blank" class="cmd-link">@diorpillow</a>\ntiktok  : <a href="https://tiktok.com/@xrlr" target="_blank" class="cmd-link">@xrlr</a>\ntiktok  : <a href="https://tiktok.com/@tabiwarrior" target="_blank" class="cmd-link">@tabiwarrior</a>`,

            'neofetch': `OS: TrenchOS v1.0.4 x86_64\nKernel: 6.1.0-trench\nShell: bash 5.2\nAudio Track: Skeletrix Melodies (1).mp3`,

            'secret': `have peace in your heart, ok?`,

            'clear': () => {
                document.getElementById('cli-output').innerHTML = '';
                return '';
            }
        };

        cliInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (isTyping) return;

                const rawVal = cliInput.value.trim();
                const inputVal = rawVal.toLowerCase();
                const args = inputVal.split(' ');
                const mainCmd = args[0];

                if (!rawVal) return;

                let response = '';

                if (mainCmd === 'audio') {
                    const subCmd = args[1];
                    const param = args[2];

                    if (subCmd === 'play') {
                        audio.play();
                        response = 'audio started.';
                    } else if (subCmd === 'pause') {
                        audio.pause();
                        response = 'audio paused.';
                    } else if (subCmd === 'volume' && param) {
                        const volNum = parseInt(param);
                        if (!isNaN(volNum) && volNum >= 0 && volNum <= 100) {
                            audio.volume = volNum / 100;
                            response = `volume set to ${volNum}%.`;
                        } else {
                            response = 'usage: audio volume [0-100]';
                        }
                    } else {
                        response = `audio controls:\n  audio play\n  audio pause\n  audio volume [0-100]`;
                    }
                } else if (commands[mainCmd]) {
                    response = typeof commands[mainCmd] === 'function' ? commands[mainCmd]() : commands[mainCmd];
                } else {
                    response = `command not found: ${mainCmd}. Type 'help' for options.`;
                }

                if (mainCmd === 'clear') {
                    commands['clear']();
                } else {
                    typeWriterPrint(rawVal, response);
                }

                cliInput.value = '';
                cliBox.scrollTop = cliBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
