<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrenchOS v1.0.4 | quat</title>
    <style>
        :root {
            --bg-color: #050505;
            --main-accent: #ffffff;
            --dim-accent: rgba(255, 255, 255, 0.25);
            --text-gray: #888;
            --border-color: #222222;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            font-family: var(--font-stack);
            overflow: hidden;
        }

        /* CRT Scanline Effect */
        .scanline {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.02),
                rgba(255, 255, 255, 0.01),
                rgba(255, 255, 255, 0.02)
            );
            background-size: 100% 3px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        /* Splash Screen */
        #splash {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.5s ease;
        }

        .splash-btn {
            background: transparent;
            border: 1px solid var(--main-accent);
            color: var(--main-accent);
            padding: 15px 30px;
            font-family: var(--font-stack);
            font-size: 1.1rem;
            text-transform: lowercase;
            letter-spacing: 2px;
            box-shadow: 0 0 10px var(--dim-accent);
            transition: all 0.2s ease;
        }

        .splash-btn:hover {
            background: var(--main-accent);
            color: #000;
            box-shadow: 0 0 20px var(--main-accent);
        }

        /* Bootup Screen */
        #boot {
            position: fixed;
            inset: 0;
            background-color: var(--bg-color);
            padding: 40px;
            display: none;
            flex-direction: column;
            font-size: 0.9rem;
            color: var(--main-accent);
            z-index: 40;
            overflow: hidden;
        }

        /* Main OS Interface */
        #main-ui {
            display: none;
            width: 100%;
            height: 100%;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .terminal-window {
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            background: rgba(10, 10, 10, 0.95);
            border: 1px solid var(--border-color);
            box-shadow: 0 0 30px rgba(0,0,0,0.9), inset 0 0 1px var(--text-gray);
            border-radius: 4px;
            backdrop-filter: blur(5px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .terminal-header {
            background: #0f0f0f;
            padding: 10px 15px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-gray);
        }

        .terminal-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #222;
        }

        .dot.active { background: #555; }

        .terminal-body {
            padding: 24px 20px 20px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* Avatar Section with White Frame */
        .avatar-container {
            width: 110px;
            height: 110px;
            border: 1px solid #ffffff;
            padding: 3px;
            margin-bottom: 14px;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        .avatar-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(20%) contrast(110%);
        }

        .user-name {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
        }

        .user-desc {
            color: var(--text-gray);
            font-size: 0.85rem;
            letter-spacing: 3px;
            margin-bottom: 8px;
        }

        .sub-tag {
            color: var(--main-accent);
            font-size: 0.8rem;
        }

        .divider {
            width: 100%;
            height: 1px;
            background: var(--border-color);
            margin: 16px 0 12px 0;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background-color: var(--main-accent);
            border-radius: 50%;
            margin-right: 6px;
            box-shadow: 0 0 5px var(--main-accent);
        }

        /* Interactive Shell Console */
        .cli-container {
            width: 100%;
            background: #000;
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
            font-size: 0.8rem;
            height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .cli-output {
            color: #aaa;
            margin-bottom: 6px;
            white-space: pre-wrap;
            line-height: 1.4;
        }

        .cli-input-row {
            display: flex;
            align-items: center;
            color: var(--main-accent);
        }

        .cli-prompt {
            margin-right: 8px;
        }

        .cli-input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--main-accent);
            font-family: var(--font-stack);
            font-size: 0.8rem;
            width: 100%;
        }

        .cmd-link {
            color: var(--main-accent);
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="scanline"></div>

    <!-- Splash Screen -->
    <div id="splash">
        <button class="splash-btn" onclick="startBootSequence()">click to enter...</button>
    </div>

    <!-- Boot Terminal -->
    <div id="boot">
        <div id="boot-log"></div>
    </div>

    <!-- Main OS Interface -->
    <div id="main-ui">
        <div class="terminal-window">
            <div class="terminal-header">
                <span>TrenchOS v1.0.4 - bash</span>
                <div class="terminal-dots">
                    <div class="dot active"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            </div>

            <div class="terminal-body">
                <!-- Avatar, Display, Description ONLY -->
                <div class="avatar-container">
                    <img src="image_9ffce4.jpg" alt="quat avatar">
                </div>

                <div class="user-name">quat</div>
                <div class="user-desc">1017</div>
                <div class="sub-tag"><span class="status-dot"></span>system/online</div>

                <div class="divider"></div>

                <!-- Interactive Terminal Box -->
                <div class="cli-container" id="cli-box" onclick="document.getElementById('cli-input').focus()">
                    <div class="cli-output" id="cli-output">Type 'help' to list terminal commands.</div>
                    <div class="cli-input-row">
                        <span class="cli-prompt">quat@trench:~$</span>
                        <input type="text" id="cli-input" class="cli-input" autocomplete="off" spellcheck="false">
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Embedded Audio Element -->
    <audio id="bg-audio" loop>
        <source src="Skeletrix Melodies (1).mp3" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('bg-audio');

        const bootLogs = [
            "INITIALIZING TrenchOS v1.0.4...",
            "LOADING KERNEL MODULES...",
            "MOUNTING /DEV/SKELETRIX...",
            "AUTHENTICATING USER: quat (@diorpillow)...",
            "DECRYPTION COMPLETE.",
            "LAUNCHING INTERACTIVE TERMINAL..."
        ];

        function startBootSequence() {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('boot').style.display = 'flex';
                
                audio.volume = 0.5;
                audio.play().catch(() => console.log("Audio playback blocked"));

                runBootLogs(0);
            }, 500);
        }

        function runBootLogs(index) {
            if (index < bootLogs.length) {
                const logItem = document.createElement('div');
                logItem.style.marginBottom = '8px';
                logItem.innerText = `> ${bootLogs[index]}`;
                document.getElementById('boot-log').appendChild(logItem);
                
                setTimeout(() => runBootLogs(index + 1), 180);
            } else {
                setTimeout(() => {
                    document.getElementById('boot').style.display = 'none';
                    document.getElementById('main-ui').style.display = 'flex';
                    document.getElementById('cli-input').focus();
                }, 300);
            }
        }

        function printToCli(htmlText) {
            const cliOutput = document.getElementById('cli-output');
            cliOutput.innerHTML += htmlText;
            const cliBox = document.getElementById('cli-box');
            cliBox.scrollTop = cliBox.scrollHeight;
        }

        // Terminal Interactive Commands
        const cliInput = document.getElementById('cli-input');
        const cliBox = document.getElementById('cli-box');

        const commands = {
            'help': `COMMANDS:
---------
help     : list available system commands
whoami   : display profile details
socials  : social media links
audio    : audio options
neofetch : display system specs
clear    : clear output screen
secret   : hidden system directive`,

            'whoami': `user : quat\ndesc : 1017\nhost : github.io`,

            'socials': `discord   : @diorpillow\ninstagram : <a href="https://instagram.com/diorpillow" target="_blank" class="cmd-link">@diorpillow</a>\ntiktok  : <a href="https://tiktok.com/@xrlr" target="_blank" class="cmd-link">@xrlr</a>\ntiktok  : <a href="https://tiktok.com/@tabiwarrior" target="_blank" class="cmd-link">@tabiwarrior</a>`,

            'neofetch': `OS: TrenchOS v1.0.4 x86_64\nKernel: 6.1.0-trench\nShell: bash 5.2\nAudio Track: Skeletrix Melodies (1).mp3`,

            'secret': `have peace in your heart, ok?`,

            'clear': () => {
                document.getElementById('cli-output').innerHTML = '';
                return '';
            }
        };

        cliInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const rawVal = cliInput.value.trim();
                const inputVal = rawVal.toLowerCase();
                const args = inputVal.split(' ');
                const mainCmd = args[0];

                if (!rawVal) return;

                let response = '';

                // Handle Audio Subcommands
                if (mainCmd === 'audio') {
                    const subCmd = args[1];
                    const param = args[2];

                    if (subCmd === 'play') {
                        audio.play();
                        response = 'audio started.';
                    } else if (subCmd === 'pause') {
                        audio.pause();
                        response = 'audio paused.';
                    } else if (subCmd === 'volume' && param) {
                        const volNum = parseInt(param);
                        if (!isNaN(volNum) && volNum >= 0 && volNum <= 100) {
                            audio.volume = volNum / 100;
                            response = `volume set to ${volNum}%.`;
                        } else {
                            response = 'usage: audio volume [0-100]';
                        }
                    } else {
                        response = `audio controls:\n  audio play\n  audio pause\n  audio volume [0-100]`;
                    }
                } else if (commands[mainCmd]) {
                    response = typeof commands[mainCmd] === 'function' ? commands[mainCmd]() : commands[mainCmd];
                } else {
                    response = `command not found: ${mainCmd}. Type 'help' for options.`;
                }

                if (mainCmd !== 'clear') {
                    printToCli(`\n<span style="color: var(--main-accent)">quat@trench:~$ ${rawVal}</span>\n${response}`);
                }

                cliInput.value = '';
                cliBox.scrollTop = cliBox.scrollHeight;
            }
        });
    </script>
</body>
</html>
